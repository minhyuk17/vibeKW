<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>할 일 목록</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Arial, "Noto Sans KR", sans-serif;
      background: #f4f7fb;
      color: #1f2937;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
    }

    .app {
      width: min(100%, 520px);
      padding: 32px;
      background: #fff;
      border: 1px solid #e5e7eb;
      border-radius: 20px;
      box-shadow: 0 16px 40px rgba(31, 41, 55, 0.1);
    }

    h1 { margin: 0 0 24px; font-size: 28px; text-align: center; }

    .input-row { display: flex; gap: 10px; }

    input {
      min-width: 0;
      flex: 1;
      padding: 13px 14px;
      border: 1px solid #d1d5db;
      border-radius: 10px;
      font-size: 16px;
      outline: none;
    }

    input:focus { border-color: #4f46e5; box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.15); }

    button {
      border: 0;
      border-radius: 10px;
      padding: 0 16px;
      background: #4f46e5;
      color: #fff;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
    }

    button:hover { background: #4338ca; }

    ul { display: grid; gap: 10px; padding: 0; margin: 24px 0 0; list-style: none; }

    li {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 14px;
      background: #f8fafc;
      border-radius: 10px;
    }

    li span { flex: 1; overflow-wrap: anywhere; }
    li.completed span { color: #9ca3af; text-decoration: line-through; }

    .delete-button {
      padding: 7px 10px;
      background: #ef4444;
      font-size: 13px;
    }

    .delete-button:hover { background: #dc2626; }
    .empty { margin: 24px 0 0; color: #9ca3af; text-align: center; }
  </style>
</head>
<body>
  <main class="app">
    <h1>할 일 목록</h1>
    <form id="todo-form" class="input-row">
      <input id="todo-input" type="text" placeholder="할 일을 입력하세요" aria-label="할 일 입력" autocomplete="off">
      <button type="submit">추가</button>
    </form>
    <ul id="todo-list" aria-live="polite"></ul>
    <p id="empty-message" class="empty">아직 등록된 할 일이 없습니다.</p>
  </main>

  <script>
    const form = document.getElementById('todo-form');
    const input = document.getElementById('todo-input');
    const list = document.getElementById('todo-list');
    const emptyMessage = document.getElementById('empty-message');

    form.addEventListener('submit', (event) => {
      event.preventDefault();
      const text = input.value.trim();
      if (!text) {
        input.focus();
        return;
      }

      const item = document.createElement('li');
      const checkbox = document.createElement('input');
      checkbox.type = 'checkbox';
      checkbox.setAttribute('aria-label', `${text} 완료`);

      const label = document.createElement('span');
      label.textContent = text;

      const deleteButton = document.createElement('button');
      deleteButton.type = 'button';
      deleteButton.className = 'delete-button';
      deleteButton.textContent = '삭제';
      deleteButton.setAttribute('aria-label', `${text} 삭제`);

      checkbox.addEventListener('change', () => {
        item.classList.toggle('completed', checkbox.checked);
      });

      deleteButton.addEventListener('click', () => {
        item.remove();
        emptyMessage.hidden = list.children.length > 0;
      });

      item.append(checkbox, label, deleteButton);
      list.appendChild(item);
      emptyMessage.hidden = true;
      input.value = '';
      input.focus();
    });
  </script>
</body>
</html>
